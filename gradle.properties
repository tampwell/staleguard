group = com.tampwell.staleguard
version = 1.7.0

pluginRepositoryUrl = https://github.com/tampwell/staleguard

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Gradle Build Cache DISABLED: twice served stale compiled test classes after
# constructor/method signature changes (NoSuchMethodError in tests that pass
# on clean builds). Correctness > ~1min of build time for this project size.
org.gradle.caching = false
