name: Feature request
description: A build setup or check Staleguard should handle
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        If this is more of an open question or you want to talk it through first, Discussions is the better place.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation in your project, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: What your build looks like
      description: A snippet helps here too, especially for anything involving version catalogs, BOMs, properties, or a corporate repository.
      render: kotlin
  - type: textarea
    id: idea
    attributes:
      label: What you think Staleguard should do
