name: Bug report
description: Something in Staleguard is not working
labels: ["bug"]
body:

  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true

  - type: dropdown
    id: buildfile
    attributes:
      label: Which build file is involved?
      options:
        - pom.xml (Maven)
        - build.gradle (Gradle, Groovy DSL)
        - build.gradle.kts (Gradle, Kotlin DSL)
        - gradle/libs.versions.toml (version catalog)
        - Not specific to one build file
    validations:
      required: true

  - type: input
    id: dependency
    attributes:
      label: Dependency involved
      description: The coordinates and the version exactly as written in your build file.
      placeholder: com.google.code.gson:gson:2.8.9

  - type: textarea
    id: logs
    attributes:
      label: Staleguard log lines
      description: >
        Help → Show Log in Explorer, open idea.log, and paste any lines containing
        "Staleguard". These usually identify the cause immediately.
      render: text

  - type: input
    id: versions
    attributes:
      label: IDE and Staleguard version
      placeholder: IntelliJ IDEA 2025.3, Staleguard 1.0.0
    validations:
      required: true
