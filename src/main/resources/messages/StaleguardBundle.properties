settings.mirrors=Use Maven mirrors from settings.xml
settings.mirrors.comment=Routes Maven Central lookups through the mirror your ~/.m2/settings.xml declares, exactly as Maven would. Corporate Nexus and Artifactory setups usually need this on; if the mirror blocks Central, Staleguard does not probe it directly.
